name: Build custom clients

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Which jobs to run"
        type: choice
        options:
          - all
          - android
          - linux
          - windows
        default: all
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build_custom_${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - name: Format check (report only)
        continue-on-error: true
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main.dart \
            lib/config/app_config.dart \
            lib/config/setting_keys.dart \
            lib/pages/sign_in/sign_in_page.dart \
            lib/pages/sign_in/view_model/sign_in_view_model.dart \
            lib/utils/sign_in_flows/check_homeserver.dart \
            lib/utils/bot_menu.dart \
            lib/utils/bot_card.dart \
            lib/utils/desktop_audio.dart \
            lib/utils/desktop_tray.dart \
            lib/pages/chat/input_bar.dart \
            lib/pages/chat/chat.dart \
            lib/pages/chat/events/bot_card.dart \
            lib/pages/chat/events/message.dart \
            lib/pages/chat/events/message_content.dart \
            lib/utils/matrix_sdk_extensions/filtered_timeline_extension.dart \
            lib/widgets/local_notifications_extension.dart \
            test/bot_menu_test.dart \
            test/bot_card_test.dart
      - name: Analyze changed files
        run: |
          flutter analyze \
            lib/main.dart \
            lib/config/app_config.dart \
            lib/config/setting_keys.dart \
            lib/pages/sign_in/sign_in_page.dart \
            lib/pages/sign_in/view_model/sign_in_view_model.dart \
            lib/utils/sign_in_flows/check_homeserver.dart \
            lib/utils/bot_menu.dart \
            lib/utils/bot_card.dart \
            lib/utils/desktop_audio.dart \
            lib/utils/desktop_tray.dart \
            lib/pages/chat/input_bar.dart \
            lib/pages/chat/chat.dart \
            lib/pages/chat/events/bot_card.dart \
            lib/pages/chat/events/message.dart \
            lib/pages/chat/events/message_content.dart \
            lib/utils/matrix_sdk_extensions/filtered_timeline_extension.dart \
            lib/widgets/local_notifications_extension.dart \
            test/bot_menu_test.dart \
            test/bot_card_test.dart \
            test/login_homeservers_test.dart
      - name: Bot menu and bot card unit tests
        run: |
          flutter test test/bot_menu_test.dart
          flutter test test/bot_card_test.dart
          # 登录页不能再退回 matrix.org / 远端列表
          flutter test test/login_homeservers_test.dart

  android:
    runs-on: ubuntu-26.04
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'android'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: ./.github/actions/free_up_space
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: flutter pub get
      - name: Configure APK signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 固定签名：keystore 只从 repository secret 取，缺失直接失败。
          # 不再回退到每次现生成的一次性 key —— 那样的 APK 换个版本就覆盖不了，
          # 用户必须先卸载，等于每次升级都丢本地数据。生成/备份方法见 BUILD.md。
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置。不要用一次性 key 发包（不同次构建的 APK 互相覆盖不了）。"
            echo "按 BUILD.md「Android 固定签名」生成并配置 4 个 secret 后重跑。"
            exit 1
          fi
          echo "Using the fixed keystore from repository secrets"
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/custom.keystore
          store_pass="${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required when ANDROID_KEYSTORE_BASE64 is set}"
          key_pass="${KEY_PASSWORD:-$store_pass}"
          alias="${KEY_ALIAS:-fluffychatCustom}"
          {
            echo "storePassword=$store_pass"
            echo "keyPassword=$key_pass"
            echo "keyAlias=$alias"
            echo "storeFile=../custom.keystore"
          } > android/key.properties
      - name: Build APK (per-ABI splits)
        run: flutter build apk --release --split-per-abi
      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          : > android-signature.txt
          for apk in build/app/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | sed "s|^|$(basename "$apk"): |" | tee -a android-signature.txt
          done
          # 所有 ABI 必须是同一张证书，否则其中一个包装不上或升不了级
          digest=$(sed 's/^[^:]*: //' android-signature.txt | sort -u)
          count=$(printf '%s\n' "$digest" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::APK 签名证书不一致（共 $count 张），无法覆盖升级"
            cat android-signature.txt
            exit 1
          fi
          printf 'cert-sha256: %s\n' "$digest" > android-signature.txt
          cat android-signature.txt
      - name: Verify every APK holds exactly one ABI
        run: python3 scripts/verify_apk_abi.py build/app/outputs/apk/release
      - name: Checksums
        run: |
          cd build/app/outputs/apk/release
          sha256sum *.apk > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-android-apk
          path: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/apk/release/SHA256SUMS-android.txt
            android-signature.txt
          if-no-files-found: error

  linux:
    # 构建基线：产物必须在 Ubuntu 22.04（glibc 2.35 / libstdc++ 3.4.30）上能跑。
    # Flutter 的 Linux 插件（flutter_webrtc、livekit_client、flutter_secure_storage、
    # sqlcipher、webcrypto）都是构建机上现编译的，构建机 glibc 会写进产物的符号引用。
    # 历史上整套 job 跑在 ubuntu-26.04 上，产物要求 GLIBC_2.38/2.43，22.04 用户装上直接起不来。
    # 所以这里钉死 ubuntu-22.04（/ -arm），下面的自检步骤会在基线漂移时直接让 job 失败。
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'linux'
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK dependencies
        run: |
          # jammy 的包名：webkit2gtk 走 4.1（libsoup3），mpv 运行时叫 libmpv1
          # （libmpv-dev 是 pull 它的开发包；24.04+ 上才叫 libmpv2）
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libglu1-mesa libblkid-dev liblzma-dev libjsoncpp-dev \
            libsecret-1-dev libsecret-1-0 libssl-dev libsoup-3.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libayatana-indicator3-dev libdbusmenu-glib-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Flutter from git (arm64)
        if: matrix.arch == 'arm64'
        run: |
          V=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")
          git clone --branch "$V" https://github.com/flutter/flutter.git
          echo "$PWD/flutter/bin" >> $GITHUB_PATH
          ./flutter/bin/flutter --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}
      - run: flutter pub get
      - name: Build Linux bundle
        run: flutter build linux --release --target-platform linux-${{ matrix.arch }}
      - name: Check glibc / libstdc++ baseline
        shell: bash
        run: |
          # 基线：Ubuntu 22.04 的 glibc 2.35 + libstdc++ 3.4.30（GCC 12）。
          # 超过基线就让 job 挂，并打印是哪个 .so 要求的版本。
          REPORT_FILE=glibc-baseline-linux-${{ matrix.arch }}.txt \
            bash scripts/check-linux-glibc-baseline.sh \
              build/linux/${{ matrix.arch }}/release/bundle 2.35 3.4.30 \
            | tee glibc-report-linux-${{ matrix.arch }}.log
      - name: Report libmpv availability
        run: |
          # media_kit needs libmpv at runtime for call and notification sounds.
          # It is NOT bundled (its ffmpeg dependency tree is not portable), so
          # only report it here: the app degrades to silent instead of crashing.
          if ls /usr/lib/*/libmpv.so* /lib/*/libmpv.so* >/dev/null 2>&1; then
            echo "libmpv present on this runner: $(ls /usr/lib/*/libmpv.so* 2>/dev/null | head -1)"
          else
            echo "::warning::libmpv not installed; Linux builds run silently until the user installs it (apt install libmpv2)"
          fi
      - name: Archive
        run: |
          tar -czf fluffychat-linux-${{ matrix.arch }}.tar.gz \
            -C build/linux/${{ matrix.arch }}/release/bundle .
          sha256sum fluffychat-linux-${{ matrix.arch }}.tar.gz > SHA256SUMS-linux-${{ matrix.arch }}.txt
          cat SHA256SUMS-linux-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-linux-${{ matrix.arch }}
          path: |
            fluffychat-linux-${{ matrix.arch }}.tar.gz
            SHA256SUMS-linux-${{ matrix.arch }}.txt
            glibc-baseline-linux-${{ matrix.arch }}.txt
            glibc-report-linux-${{ matrix.arch }}.log
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.targets == 'all' || github.event.inputs.targets == 'windows'
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - run: choco install innosetup -y
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package installer and portable zip
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildMode Release
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem build/windows/installer/*.exe, build/windows/installer/*.zip |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content build/windows/installer/SHA256SUMS-windows.txt -Encoding ascii
          Get-Content build/windows/installer/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fluffychat-windows
          path: |
            build/windows/installer/fluffychat-windows-x64-setup.exe
            build/windows/installer/fluffychat-windows-x64.zip
            build/windows/installer/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    # Tag pushes publish the artifacts as a GitHub release, which outlives the
    # 90 day artifact retention.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, android, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Merge checksums and build info
        run: |
          cd dist
          # 按 ABI 拆分后是多个包，文件名带上架构；万一哪天退回 universal 包也能处理
          if [ -f app-release.apk ]; then
            mv app-release.apk "fluffychat-android-${GITHUB_REF_NAME}.apk"
          fi
          ANDROID_ABIS=""
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "fluffychat-android-${abi}-${GITHUB_REF_NAME}.apk"
            ANDROID_ABIS="$ANDROID_ABIS $abi"
          done
          FLUTTER_VERSION=$(grep -o '"flutter": *"[^"]*"' ../.fvmrc | cut -d'"' -f4)
          # 两个 job 各自写一份结论文件，这里只负责汇总，不手写环境信息（避免又变成硬编码）
          MIN_GLIBC=$(sed -n 's/^min-glibc=//p' glibc-baseline-linux-x64.txt 2>/dev/null | head -1)
          ANDROID_SIG=$(sed -n 's/^cert-sha256: //p' android-signature.txt 2>/dev/null | head -1)
          LINUX_RUNTIME_DEPS="libmpv2 (Ubuntu 24.04+) / libmpv1 (Ubuntu 22.04) — 语音/视频消息必需，未安装则静音； libwebkit2gtk-4.1-0 libsecret-1-0 libayatana-appindicator3-1 libdbusmenu-glib-0 libgtk-3-0"
          {
            echo "fluffychat custom build"
            echo "tag: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "flutter: ${FLUTTER_VERSION}"
            echo "android abis:${ANDROID_ABIS:- none}"
            echo "min glibc: ${MIN_GLIBC:-unknown}"
            echo "runtime apt deps: ${LINUX_RUNTIME_DEPS}"
            echo "android signature: ${ANDROID_SIG:-unknown}"
          } > BUILD-INFO.txt
          rm -f SHA256SUMS-*.txt android-signature.txt
          sha256sum *.apk *.tar.gz *.exe *.zip > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt BUILD-INFO.txt
      - uses: softprops/action-gh-release@v3.0.4
        with:
          files: dist/**
          body_path: dist/BUILD-INFO.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
